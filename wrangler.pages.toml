# Cloudflare Pages configuration
name = "ai-resume-editor"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "resume-rewriter/dist"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "ai-resume-editor-db"
database_id = "afb1de3b-3cb7-48b6-a54b-662ac35f0a80"

# R2 Storage binding
[[r2_buckets]]
binding = "RESUME_BUCKET"
bucket_name = "ai-resume-bucket"

# Environment variables (non-sensitive)
[vars]
NODE_ENV = "production"
APP_URL = "https://ai-resume-editor.pages.dev"
AI_PROVIDER = "anthropic"  # Using Anthropic Claude (ANTHROPIC_API_KEY is configured)

# Secrets are managed via: wrangler pages secret put <NAME>
# Required secrets for AI:
#   wrangler pages secret put OPENAI_API_KEY
#   OR
#   wrangler pages secret put ANTHROPIC_API_KEY

